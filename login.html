<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediTrack</title>
    <!-- Core and specific stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>
        <!-- Dynamic header injected by nav-loader.js -->
    </header>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to manage and track your daily medicines</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" placeholder="e.g. name@example.com" required>
                    </div>
                    <div class="error-msg"></div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                        <span class="password-toggle" data-target="loginPassword">👁️‍🗨️</span>
                    </div>
                    <div class="error-msg"></div>
                </div>

                <div class="auth-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-pass" onclick="showToast('Password reset is not configured on this simulator.', 'info')">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-submit-btn">Login</button>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Script imports -->
    <script type="module" src="js/nav-loader.js"></script>
    <script type="module" src="js/auth.js"></script>

</body>

</html>
