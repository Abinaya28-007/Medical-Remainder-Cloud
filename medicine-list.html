<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicines - MediTrack</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medicine.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>
        <!-- Injected dynamically by nav-loader.js -->
    </header>

    <div class="med-page-wrapper">
        <div class="card-container">
            <div class="list-actions">
                <h2>My Medications</h2>
                <a href="add-medicine.html" class="btn btn-primary">+ Add New Medicine</a>
            </div>

            <!-- Table showing medicines -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Medicine</th>
                            <th>Dosage</th>
                            <th>Frequency</th>
                            <th>Time</th>
                            <th>Schedule</th>
                            <th>Food Pref.</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="medicineTable">
                        <tr>
                            <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 40px;">
                                Loading medicines...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Medicine Modal Overlay -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Edit Medicine Details</h3>
                <button class="btn-close-modal" id="closeModalBtn">&times;</button>
            </div>
            
            <form id="editMedicineForm" novalidate>
                <input type="hidden" id="editMedId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editMedicineName">Medicine Name</label>
                        <input type="text" id="editMedicineName" required>
                    </div>

                    <div class="form-group">
                        <label for="editDosage">Dosage</label>
                        <input type="text" id="editDosage" placeholder="e.g. 500 mg" required>
                    </div>

                    <div class="form-group">
                        <label for="editFrequency">Frequency</label>
                        <select id="editFrequency" required>
                            <option value="Daily">Daily</option>
                            <option value="Twice a Day">Twice a Day</option>
                            <option value="Thrice a Day">Thrice a Day</option>
                            <option value="Weekly">Weekly</option>
                            <option value="As Needed">As Needed/PRN</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editTime">Reminder Time</label>
                        <input type="time" id="editTime" required>
                    </div>

                    <div class="form-group">
                        <label for="editStartDate">Start Date</label>
                        <input type="date" id="editStartDate" required>
                    </div>

                    <div class="form-group">
                        <label for="editEndDate">End Date</label>
                        <input type="date" id="editEndDate" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="editFood">Food Preference</label>
                        <select id="editFood" required>
                            <option value="Before Food">Before Food</option>
                            <option value="After Food">After Food</option>
                            <option value="With Food">With Food</option>
                            <option value="No Preference">No Preference</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="editNotes">Notes / Special Instructions</label>
                        <textarea id="editNotes" placeholder="e.g. Do not crush, take with plenty of water..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/nav-loader.js"></script>
    <script type="module" src="js/medicine.js"></script>

</body>

</html>
